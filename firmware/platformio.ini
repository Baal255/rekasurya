; Konfigurasi PlatformIO untuk Firmware REKASURYA v2
; Target utama: ESP32-WROOM-32E (arsitektur PCB REKASURYA)
; Target native: Simulasi dan uji unit logika di host menggunakan MockHardwareHal

[platformio]
default_envs = native

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -std=gnu++17
  -DREKASURYA_TARGET_ESP32=1
  -DCORE_DEBUG_LEVEL=3
  -Iinclude
  -Isrc
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.2.0

[env:native]
platform = native
build_flags =
  -std=c++17
  -DREKASURYA_TARGET_NATIVE=1
  -Iinclude
  -Isrc
